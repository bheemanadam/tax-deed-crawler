name: Semi-Weekly Auction Crawler

on:
  schedule:
    # Runs exactly twice a week: Tuesday and Friday at 9:00 AM UTC (5:00 AM EST)
    - cron: '0 9 * * 2,5'
  workflow_dispatch: # Allows you to trigger the crawler manually via the UI button

jobs:
  run-crawler:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      
    steps:
      # 1. Pull the code from your private repo into the cloud runner
      - name: Checkout Repository Code
        uses: actions/checkout@v4

      # 2. Provision a clean Python execution machine
      - name: Initialize Python Environment
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          # Caching configuration removed to prevent requirements.txt file-matching crash

      # 3. Restore your scraping requirements (Optimized for speed)
      - name: Install Libraries
        run: |
          python -m pip install --upgrade pip
          pip install httpx

      # 4. Execute your target scraping script
      - name: Run Auction Scanner
        run: |
          python main_crawler.py

      # 5. Automatically save changes and commit the text lists back to your repository
      - name: Commit and Push Updated Lists
        run: |
          git config --global user.name "AuctionBot"
          git config --global user.email "bot@github.com"
          git add upcoming_auctions.json || true
          git commit -m "Automated Scan: Updated Auction Data Logs" || exit 0
          git push